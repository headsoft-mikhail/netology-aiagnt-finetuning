run:
  name: support_lora_minimal
  seed: 42

paths:
  train_dataset: data/fine_tuning/train.jsonl
  eval_dataset: data/fine_tuning/eval.jsonl
  base_model: data/models/base/Qwen2.5-0.5B-Instruct
  runs: data/fine_tuning/runs
  adapters: data/models/adapters
  reports: data/fine_tuning/reports

model:
  name: Qwen/Qwen2.5-0.5B-Instruct
  revision: 7ae557604adf67be50417f59c2c2f167def9a775
  device: auto
  dtype: float32
  max_seq_length: 512
  trust_remote_code: false

lora:
  method: lora
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - v_proj

training:
  learning_rate: 0.0002
  lr_scheduler_type: linear
  optimizer: adamw_torch
  weight_decay: 0.0
  max_grad_norm: 1.0
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  num_train_epochs: 2
  warmup_steps: 0.03
  logging_strategy: steps
  logging_steps: 1
  eval_strategy: epoch
  save_strategy: epoch
  save_total_limit: 1
  gradient_checkpointing: false
  report_to: none

generation:
  do_sample: false
  max_new_tokens: 128
